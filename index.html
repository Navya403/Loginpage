<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Sign in</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f7fb;
        color: #182230;
        font-family: Arial, sans-serif;
      }

      .login-card {
        width: min(100%, 400px);
        padding: 36px;
        border: 1px solid #e5eaf1;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(24 34 48 / 8%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .subtitle {
        margin: 0 0 28px;
        color: #657386;
      }

      label {
        display: block;
        margin: 16px 0 8px;
        font-size: 14px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
      }

      input:focus {
        border-color: #4668e8;
        outline: 3px solid rgb(70 104 232 / 16%);
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 13px;
        border: 0;
        border-radius: 8px;
        background: #4668e8;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      button:hover {
        background: #3554cb;
      }

      .message {
        margin: 18px 0 0;
        color: #247044;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      function LoginPage() {
        const [message, setMessage] = React.useState("");

        function handleSubmit(event) {
          event.preventDefault();
          setMessage("Form submitted. Connect this page to your login API.");
        }

        return (
          <main className="login-card">
            <h1>Welcome back</h1>
            <p className="subtitle">Sign in to your account</p>
            <form onSubmit={handleSubmit}>
              <label htmlFor="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autoComplete="email"
                required
              />
              <label htmlFor="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autoComplete="current-password"
                required
              />
              <button type="submit">Sign in</button>
            </form>
            {message && <p className="message" role="status">{message}</p>}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<LoginPage />);
    </script>
  </body>
</html>
